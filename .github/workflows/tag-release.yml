name: Tag release
on:
  push:
    branches: [internal/master]

jobs:
  tag_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      release_version: ${{ steps.outputs.outputs.release_version }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com
      - name: Read Go version from go.mod
        id: goversion
        run: |
          ver=$(awk '/^go / { print $2; exit }' go.mod)
          if [ -z "${ver}" ]; then
            ver=$(awk '/^toolchain / { sub(/^go/, "", $2); print $2; exit }' go.mod)
          fi
          if [ -z "${ver}" ]; then
            echo "::error::could not parse Go version from go.mod"
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true
      - name: Tidy Go modules
        run: go mod tidy
      - name: Extract and setup release information
        run: |
          releaseVersion=`cat VERSION`
          export RELEASE_VERSION=$releaseVersion
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
      - name: Build using Makefile
        run: make build GIT_DESCRIBE=${{ env.RELEASE_VERSION }} ARCH=arm64
      - name: Create GitHub Release and Upload Artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          artifacts: dist/*