name: Sync upstream

on:
  schedule:
    # ~every 2 weeks: 1st and 15th of the month, 09:00 UTC
    - cron: '0 9 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  mirror-master:
    name: Fast-forward master from ovh/venom
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.ff.outputs.updated }}
      master_sha: ${{ steps.ff.outputs.master_sha }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/ovh/venom.git
          else
            git remote add upstream https://github.com/ovh/venom.git
          fi
          git fetch upstream master
          git fetch origin master

      - name: Fast-forward master
        id: ff
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          echo "master before: ${before}"

          if ! git merge --ff-only upstream/master; then
            echo "::error::master cannot fast-forward from upstream/master. master may have been polluted — reset it to upstream/master (see docs/UPSTREAM.md)."
            exit 1
          fi

          after=$(git rev-parse HEAD)
          echo "master after: ${after}"
          echo "master_sha=${after}" >> "$GITHUB_OUTPUT"

          if [ "${before}" = "${after}" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "master already up to date with upstream/master"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git push origin HEAD:master
            echo "Pushed fast-forward of master to ${after}"
          fi

  sync-develop:
    name: Open sync PR into internal/develop
    needs: mirror-master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"

      - name: Fetch branches
        run: |
          git fetch origin master internal/develop

      - name: Check whether internal/develop needs a sync
        id: need
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count origin/internal/develop..origin/master)
          echo "Commits on master not in internal/develop: ${ahead}"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          if [ "${ahead}" -eq 0 ]; then
            echo "internal/develop already contains master; nothing to sync"
          fi
      - name: Require CI_GH_TOKEN for PR operations
        if: steps.need.outputs.ahead != '0'
        env:
          PAT: ${{ secrets.CI_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PAT}" ]; then
            echo "::error::CI_GH_TOKEN secret is not set. Sync branches can still be pushed with GITHUB_TOKEN, but opening a PR (for QE review) requires a PAT — same secret as create-release.yml."
            exit 1
          fi
          # Probe repo access, not /user — fine-grained PATs often cannot call /user.
          if ! GH_TOKEN="${PAT}" gh api "repos/${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::CI_GH_TOKEN cannot access ${{ github.repository }}. Refresh the PAT (classic repo scope, or fine-grained Contents + Pull requests)."
            exit 1
          fi
          echo "CI_GH_TOKEN OK for PR operations"

      - name: Create sync branch
        if: steps.need.outputs.ahead != '0'
        id: merge
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)
          BRANCH="sync/upstream-${DATE}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Never commit <<<<<<< markers — that breaks CI and hides conflicts in the PR UI.
          # Clean merge: branch = internal/develop + master (CI tests the merged tree).
          # Conflicts: branch = master only so GitHub reports real merge conflicts on the PR.
          git checkout -B "${BRANCH}" origin/internal/develop
          conflict=false
          if git merge --no-edit origin/master; then
            echo "Merged master into ${BRANCH} cleanly"
          else
            conflict=true
            echo "Merge conflicts detected. Files:"
            git diff --name-only --diff-filter=U || true
            git merge --abort
            git checkout -B "${BRANCH}" origin/master
            echo "Reset ${BRANCH} to origin/master so the PR surfaces GitHub conflicts"
          fi
          echo "conflict=${conflict}" >> "$GITHUB_OUTPUT"

          # force-with-lease: overwrite a same-day branch that may still have
          # an old markers commit from a previous broken sync attempt.
          git push --force-with-lease -u origin "HEAD:${BRANCH}"

      - name: Ensure needs-manual-merge label exists
        if: steps.need.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.CI_GH_TOKEN }}
        run: |
          gh label create needs-manual-merge \
            --description "Upstream sync PR has merge conflicts" \
            --color B60205 \
            --force || true

      - name: Open or update pull request for QE review
        if: steps.need.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.CI_GH_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          MASTER_SHA: ${{ needs.mirror-master.outputs.master_sha }}
          QE_TEAM: socotra/quality-engineering
        run: |
          set -euo pipefail

          TITLE="chore: sync upstream into internal/develop (${BRANCH#sync/upstream-})"
          CONFLICT_NOTE=""
          if [ "${CONFLICT}" = "true" ]; then
            CONFLICT_NOTE=$(cat <<'NOTE'

          ## Conflicts
          GitHub should report merge conflicts on this PR (branch tip is clean \`master\`; do not expect \`<<<<<<<\` in the diff).

          Resolve by checking out the branch, merging \`internal/develop\`, fixing conflicts, and pushing:
          ```bash
          git fetch origin
          git checkout BRANCH_PLACEHOLDER
          git merge origin/internal/develop
          # fix conflicts, then:
          git add -A && git commit
          make test
          git push
          ```
          NOTE
            )
            CONFLICT_NOTE=${CONFLICT_NOTE//BRANCH_PLACEHOLDER/${BRANCH}}
          fi

          BODY=$(cat <<EOF
          ## Summary
          Automated sync of \`master\` (mirror of [ovh/venom](https://github.com/ovh/venom)) into \`internal/develop\`.

          - \`master\` tip: \`${MASTER_SHA}\`
          - Branch: \`${BRANCH}\`

          **Do not merge without Quality Engineering approval.** Actions will never approve this PR.
          ${CONFLICT_NOTE}
          ## QE checklist
          - [ ] Conflicts resolved in GitHub / locally (no conflict markers committed)
          - [ ] \`make test\` / CI green
          - [ ] Hotspot files reviewed (\`executors/http/http.go\`, \`go.mod\`, \`go.sum\`, \`venom.go\`, \`process*.go\`)
          - [ ] No unexpected fork-only regressions

          See [docs/UPSTREAM.md](../blob/internal/develop/docs/UPSTREAM.md).
          EOF
          )

          EXISTING=$(gh pr list --head "${BRANCH}" --base internal/develop --state open --json number --jq '.[0].number // empty')

          if [ -n "${EXISTING}" ]; then
            echo "Updating existing PR #${EXISTING}"
            gh pr edit "${EXISTING}" --title "${TITLE}" --body "${BODY}"
            PR_NUMBER="${EXISTING}"
          else
            DRAFT_FLAG=()
            if [ "${CONFLICT}" = "true" ]; then
              DRAFT_FLAG=(--draft)
            fi
            PR_URL=$(gh pr create \
              --base internal/develop \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --reviewer "${QE_TEAM}" \
              "${DRAFT_FLAG[@]}")
            echo "Created PR: ${PR_URL}"
            PR_NUMBER=$(echo "${PR_URL}" | grep -oE '[0-9]+$')
          fi

          # Always (re)request QE — never approve from Actions.
          gh pr edit "${PR_NUMBER}" --add-reviewer "${QE_TEAM}" || \
            gh api -X POST "repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f "team_reviewers[]=quality-engineering" || \
            echo "::warning::Could not request review from ${QE_TEAM}; assign manually."

          if [ "${CONFLICT}" = "true" ]; then
            gh pr ready "${PR_NUMBER}" --undo || true
            gh pr edit "${PR_NUMBER}" --add-label needs-manual-merge
          fi
